name: Calendar notifications

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check without sending messages or changing state
        type: boolean
        default: true
      reset_baseline:
        description: Replace state quietly after reviewing a calendar source change
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: calendar-notifications
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || vars.CALENDAR_NOTIFICATIONS_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out website and notification state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check calendar and notify
        id: notify
        env:
          TZ: UTC
          CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION_HERE: ${{ vars.DISCORD_MENTION_HERE || 'false' }}
          ENABLED: ${{ vars.CALENDAR_NOTIFICATIONS_ENABLED }}
          DRY_RUN: ${{ inputs.dry_run }}
          RESET_BASELINE: ${{ inputs.reset_baseline }}
        run: |
          args=(--state state/notifications.json)
          if [[ "$ENABLED" == "true" && "$DRY_RUN" != "true" ]]; then
            args+=(--send)
          fi
          if [[ "$RESET_BASELINE" == "true" ]]; then
            args+=(--baseline)
          fi
          npm run calendar:check -- "${args[@]}"

      - name: Persist completed deliveries even after a partial failure
        if: ${{ always() && steps.notify.outcome != 'skipped' }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ ! -f state/notifications.json ]]; then
            exit 0
          fi
          git add -- state/notifications.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: checkpoint calendar notifications [skip ci]'
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
